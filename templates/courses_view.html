<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Courses - SmartSMS</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  {% include 'sidebar.html' %}

  <div class="main-content">
    <header class="top-nav">
      <h1>View Courses</h1>
      <a href="{{ url_for('courses.courses_update') }}" class="glow-btn">Add / Update Course</a>
    </header>

    <div class="glass-card">
      <h2>All Courses</h2>
      <table class="glass-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Code</th>
            <th>Duration</th>
            <th>Fees</th>
            <th>Time Required</th>
          </tr>
        </thead>
        <tbody>
          {% for course in courses %}
          <tr>
            <td>{{ course.course_name }}</td>
            <td>{{ course.course_code }}</td>
            <td>{{ course.duration }}</td>
            <td>₹{{ course.course_fees }}</td>
            <td>{{ course.time_required }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
