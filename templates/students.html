<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - SmartSMS</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  {% include 'sidebar.html' %}  <!-- You can create partials or copy sidebar -->

  <div class="main-content">
    <header class="top-nav">
      <h1>Students Management</h1>
      <a href="/add_student" class="glow-btn">+ Add Student</a>
    </header>

    <input type="text" id="searchInput" placeholder="Search by name or roll no..." onkeyup="filterTable()">

    <table class="glass-table">
      <thead>
        <tr>
          <th>Photo</th>
          <th>Name</th>
          <th>Roll No</th>
          <th>Course</th>
          <th>Semester</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for student in students %}
        <tr>
          <td><img src="/uploads/{{ student.photo }}" width="50" alt=""></td>
          <td>{{ student.name }}</td>
          <td>{{ student.roll_no }}</td>
          <td>{{ student.course }}</td>
          <td>{{ student.semester }}</td>
          <td>
            <a href="/edit_student/{{ student._id }}">Edit</a>
            <a href="/delete_student/{{ student._id }}" onclick="return confirm('Delete?')">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
