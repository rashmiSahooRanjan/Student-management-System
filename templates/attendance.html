<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - SmartSMS</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  {% include 'sidebar.html' %}

  <div class="main-content">
    <header class="top-nav">
      <h1>Attendance Update</h1>
    </header>
    <div class="attendance-panel attendance-update-panel">
      <form method="POST">
        <div class="form-row">
          <label for="attendance-date">Select Date</label>
          <input id="attendance-date" type="date" name="date" value="{{ selected_date or today }}" required>
        </div>

        <table class="glass-table">
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            {% for student in students %}
            <tr>
              <td>{{ student.name }}</td>
              <td>
                <select name="student_{{ student._id }}">
                  <option value="Present">Present</option>
                  <option value="Absent">Absent</option>
                </select>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>

        <button type="submit" class="glow-btn">Submit Attendance</button>
      </form>
    </div>
  </div>
</body>
</html>
