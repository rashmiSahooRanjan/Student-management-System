<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - SmartSMS</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <div class="glass-sidebar">
    <div class="logo">🎓 SmartSMS</div>
    <nav>
      <a href="/dashboard">🏠 Dashboard</a>
      <a href="/students">👥 Students</a>
      <a href="/attendance">📅 Attendance</a>
      <a href="/marks">📊 Marks</a>
      <a href="/fees">💰 Fees</a>
      <a href="/analytics">📈 Analytics</a>
      <a href="/profile" class="active">👤 Profile</a>
      <a href="/logout">🚪 Logout</a>
    </nav>
  </div>

  <div class="main-content">
    <header class="top-nav">
      <h1>Admin Profile</h1>
    </header>

    <div class="glass-card profile-card">
      <div class="profile-header">
        <img src="{{ admin.profile_pic and '/uploads/' + admin.profile_pic or '/static/images/avatar.png' }}" alt="Profile Photo" class="profile-img">
        <h2>{{ admin.full_name or admin.name or session.admin_name }}</h2>
        <p>Administrator</p>
      </div>

      <form method="POST" enctype="multipart/form-data" class="profile-form">
        <div class="form-row">
          <label for="username">Username</label>
          <input id="username" type="text" name="username" value="{{ admin.username or '' }}" placeholder="Username">
        </div>
        <div class="form-row">
          <label for="full_name">Full Name</label>
          <input id="full_name" type="text" name="full_name" value="{{ admin.full_name or admin.name or '' }}" placeholder="Full Name">
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" value="{{ admin.email or '' }}" placeholder="Email Address">
        </div>
        <div class="form-row">
          <label for="age">Age</label>
          <input id="age" type="number" name="age" value="{{ admin.age or '' }}" placeholder="Age">
        </div>
        <div class="form-row">
          <label for="password">New Password</label>
          <input id="password" type="password" name="password" placeholder="Leave blank to keep current password">
        </div>
        <div class="form-row">
          <label for="profile_pic">Profile Picture</label>
          <input id="profile_pic" type="file" name="profile_pic" accept="image/*">
        </div>
        <button type="submit" class="glow-btn">Save Profile</button>
      </form>

      <a href="/settings" class="glow-btn">Change Password</a>
    </div>
  </div>
</body>
</html>
