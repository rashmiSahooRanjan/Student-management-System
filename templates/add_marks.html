<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add / Update Marks - SmartSMS</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <div class="glass-sidebar">
    <div class="logo">🎓 SmartSMS</div>
    <nav>
      <a href="/dashboard">🏠 Dashboard</a>
      <a href="/courses">📚 Courses</a>
      <a href="/students">👥 Students</a>
      <a href="/attendance">📅 Attendance</a>
      <a href="/marks" class="active">📊 Marks</a>
      <a href="/fees">💰 Fees</a>
      <a href="/analytics">📈 Analytics</a>
      <a href="/profile">👤 Profile</a>
    </nav>
  </div>

  <div class="main-content">
    <header class="top-nav">
      <h1>Add / Update Marks</h1>
      <a href="/marks" class="glow-btn">Back to Marks</a>
    </header>

    <div class="glass-card">
      <h2>{{ student.name }}</h2>
      <p><strong>Roll No:</strong> {{ student.roll_no }}</p>
      <p><strong>Course:</strong> {{ student.course }}</p>

      <form method="POST">
        <table class="glass-table">
          <thead>
            <tr>
              <th>Subject</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody>
            {% for i in range(1, 6) %}
            <tr>
              <td>
                <input type="text" name="subject[]" placeholder="Subject {{ i }}" required>
              </td>
              <td>
                <input type="number" name="score[]" min="0" max="100" placeholder="0-100" required>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>

        <button type="submit" class="glow-btn">Save Marks</button>
      </form>
    </div>
  </div>
</body>
</html>
