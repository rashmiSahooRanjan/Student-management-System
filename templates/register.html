<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduNova — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{background:#fff;border-radius:24px;padding:50px 44px;width:100%;max-width:460px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:30px}
.brand-icon{width:42px;height:42px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.brand-name{font-size:22px;font-weight:800;color:#1a1a2e}
h3{font-size:22px;font-weight:800;color:#1a1a2e;margin-bottom:6px}
.sub{color:#6b7280;font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:11px 14px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;transition:.2s;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;margin-top:6px}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(79,70,229,.35)}
.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px}
.alert-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.alert-success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.link{text-align:center;font-size:14px;color:#6b7280;margin-top:16px}
.link a{color:#4f46e5;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
    <div class="brand-name">EduNova</div>
  </div>
  <h3>Create Account</h3>
  <p class="sub">Register to access your panel</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <div class="alert" id="alertBox" style="display:none"></div>
  <div class="form-group">
    <label>Full Name</label>
    <input type="text" id="name" placeholder="Your full name">
  </div>
  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="your@email.com">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Min 6 characters">
  </div>
  <div class="form-group">
    <label>Role</label>
    <select id="role">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="admin">Admin</option>
    </select>
  </div>
  <button class="btn" onclick="doRegister()"><i class="fas fa-user-plus"></i> Create Account</button>
  <div class="link">Already have an account? <a href="/auth/login">Login</a></div>
</div>
<script>
async function doRegister(){
  const box=document.getElementById('alertBox');
  box.style.display='none';
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const role=document.getElementById('role').value;
  if(!name||!email||!password){box.className='alert alert-danger';box.textContent='All fields required.';box.style.display='block';return;}
  const res=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password,role})});
  const data=await res.json();
  if(data.success){window.location.href='/auth/login';}
  else{box.className='alert alert-danger';box.textContent=data.message;box.style.display='block';}
}
</script>
</body>
</html>
